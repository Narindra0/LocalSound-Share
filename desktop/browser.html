<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>LocalSound — Navigateur YouTube</title><link rel="stylesheet" href="browser.css"></head><body>
<header><div class="browser-brand"><span class="browser-disc"><img src="../public/branding/icon.svg" alt=""></span><strong>YouTube <em>/ LocalSound</em></strong></div><div class="panel-actions"><button id="shareBrowser" class="share-button">Diffuser ↗</button><button id="expand" type="button" aria-label="Agrandir le lecteur" title="Agrandir le lecteur">⤢</button><button id="hide" type="button" aria-label="Masquer le lecteur sans arrêter la musique" title="Masquer sans arrêter">—</button><button id="close" type="button" aria-label="Fermer le lecteur et terminer son partage" title="Fermer et terminer le partage">×</button></div></header>
<form id="navigationForm" aria-label="Navigation YouTube"><nav aria-label="Historique"><button id="back" type="button" aria-label="Page précédente" disabled>←</button><button id="forward" type="button" aria-label="Page suivante" disabled>→</button><button id="reload" type="button" aria-label="Actualiser">↻</button><button id="home" type="button" aria-label="Accueil YouTube">⌂</button></nav><input id="address" type="text" aria-label="Adresse YouTube ou recherche" placeholder="Rechercher une musique ou saisir une adresse YouTube" autocomplete="off" spellcheck="false"><button type="submit" id="go">Aller ↗</button></form><div class="browser-status"><span id="status" role="status">Ouverture de YouTube…</span><span id="pageTitle">Votre sélection.</span></div><script src="browser.js"></script></body></html>
