    id: need
    attributes:
      label: Quel usage voulez-vous améliorer ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportement souhaité
      description: Ajouter les contraintes utiles et, si besoin, une capture ou un exemple.
    validations:
      required: true
