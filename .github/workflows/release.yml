name: Publier une version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "Version $version"
      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v${{ steps.version.outputs.version }}'
          if ('${{ github.ref_name }}' -ne $expected) {
            Write-Error "Le tag ${{ github.ref_name }} ne correspond pas à package.json ($expected)."
            exit 1
          }
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer le moteur Electron verrouillé
        run: npm run setup:desktop
      - name: Préparer les ressources et les licences
        run: npm run notices
      - name: Vérifier les fichiers destinés au dépôt
        run: npm run check:repo
      - name: Tester l’audio et les API
        run: npm test
      - name: Compiler l’hôte Windows
        run: npm run build:exe
      - name: Compiler l’auditeur Windows
        run: npm run build:listener
      - name: Compiler l’auditeur léger
        run: npm run build:listener:lite
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tester et compiler l’application Android
        working-directory: Mobile
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --split-per-abi
      - name: Rassembler les livrables et les empreintes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "release/LocalSound-Share-$version-Windows-x64.exe" dist
          Copy-Item "release/auditeur/LocalSound-Auditeur-$version-Windows-x64.exe" dist
          Copy-Item "release/auditeur-leger/LocalSound-Auditeur-Leger-$version-Windows-x64.exe" dist
          Copy-Item "Mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/LocalSound-Mobile-$version-arm64.apk"
          Copy-Item "Mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "dist/LocalSound-Mobile-$version-arm32.apk"
          $lines = foreach ($file in (Get-ChildItem -Path dist -File | Sort-Object Name)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - name: Préparer les notes de version
        run: node scripts/release-notes.js ${{ steps.version.outputs.version }} artifacts/release-notes.md
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LocalSound Share ${{ steps.version.outputs.version }}
          body_path: artifacts/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false