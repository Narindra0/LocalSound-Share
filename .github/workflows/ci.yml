name: Vérifications Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer le moteur Electron verrouillé
        run: npm run setup:desktop
      - name: Préparer les ressources et les licences
        run: npm run notices
      - name: Vérifier les fichiers destinés au dépôt
        run: npm run check:repo
      - name: Tester l’audio et les API
        run: npm test
